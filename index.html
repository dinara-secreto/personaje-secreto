<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎭 Personaje secreto</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);color:white;text-align:center}
.card{width:min(90%,520px);box-sizing:border-box;padding:35px 25px;background:rgba(255,255,255,.14);border-radius:24px;box-shadow:0 10px 35px rgba(0,0,0,.25)}
h1{margin-top:0;font-size:30px}.nombre{font-size:25px;font-weight:bold;margin:20px 0 10px}.mensaje{font-size:17px;line-height:1.5}
button{margin-top:25px;padding:16px 24px;border:0;border-radius:14px;font-size:17px;font-weight:bold;cursor:pointer;background:white;color:#5b3fa3}
.personaje{display:none;margin-top:25px;padding:22px;border-radius:18px;background:rgba(0,0,0,.25)}
.personaje .emoji{font-size:55px}.personaje .nombre-personaje{font-size:30px;font-weight:bold;margin-top:10px}.aviso{margin-top:20px;font-size:14px;opacity:.9}
</style>
</head>
<body>
<div class="card">
<h1>🎭 Descubre tu personaje secreto</h1>
<div id="contenido"></div>
</div>
<script>
const personajes={
"1":{nombre:"Alcira",personaje:"Iron Man",emoji:"🤖"},
"2":{nombre:"Diana",personaje:"Spider-Woman",emoji:"🕷️"},
"3":{nombre:"Erika",personaje:"Doctor Strange",emoji:"🔮"},
"4":{nombre:"Maryory",personaje:"Viuda Negra",emoji:"🕷️"},
"5":{nombre:"Mercedes",personaje:"Alegría",emoji:"😊"},
"6":{nombre:"Omaira",personaje:"Furia",emoji:"😡"},
"7":{nombre:"Nidia",personaje:"Desagrado",emoji:"🤢"},
"8":{nombre:"Carito",personaje:"Ansiedad",emoji:"😰"},
"9":{nombre:"Anderson",personaje:"Envidia",emoji:"💚"},
"10":{nombre:"Elizabeth",personaje:"Capitán América",emoji:"🛡️"}
};

const params=new URLSearchParams(window.location.search);
let id=params.get("p");
if(!id && window.location.hash) id=window.location.hash.substring(1);

const contenido=document.getElementById("contenido");
const persona=personajes[id];

if(!persona){
contenido.innerHTML='<p class="mensaje">Enlace no válido.</p><p class="aviso">Usa el enlace que te enviaron para descubrir tu personaje.</p>';
}else{
contenido.innerHTML='<div class="nombre">Hola, '+persona.nombre+' 👋</div><p class="mensaje">Tienes un personaje secreto preparado especialmente para ti.</p><button id="revelar">🎁 REVELAR MI PERSONAJE</button><div class="personaje" id="resultado"><div class="emoji">'+persona.emoji+'</div><div class="nombre-personaje">'+persona.personaje+'</div><p>🤫 ¡No se lo muestres a los demás!</p></div>';
document.getElementById("revelar").addEventListener("click",function(){
document.getElementById("resultado").style.display="block";this.style.display="none";
});
}
</script>
</body>
</html>
